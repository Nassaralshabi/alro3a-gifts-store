<style>
:root{
  /* Neutral white-gray premium theme (no green) */
  --charcoal:#45505a;      /* primary action */
  --charcoal-2:#3a444d;    /* hover darker */
  --charcoal-3:#33393e;    /* deep text/bgs */
  --ink:#33393e; --ink-2:#33393e; --ink-3:#33393e;
  --gray-1:#5c6870;        /* secondary text */
  --gray-2:#6e7981; --gray-3:#788288;
  --gold:#f2bd66; --gold-2:#f1ba63; --gold-3:#ffd282; --gold-ink:#9a6b13;
  --mut:#6c767d; --mut-2:#727c83; --mut-3:#788288;
  --bd:#e6e9eb; --bd-2:#eff1f3; --bd-3:#e0e4e6; --bd-4:#e1e5e8; --bd-5:#d2d8db;
  --bg-soft:#f7f8f9; --bg-tint:#f4f6f7; --bg-tint-2:#eef0f2; --bg-tint-3:#e7eaec; --bg-tint-4:#e9ecee;
  --bg-cream:#f6f7f8; --bg-hero:#f7f8f9;
  --radius:1rem;
  --shadow-card:0 18px 34px -30px rgba(35,41,46,.9);
  --shadow-card-h:0 24px 38px -28px rgba(35,41,46,.5);

  --font-display:'Marhey','Alexandria',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font-body);background:#fff;color:var(--ink);line-height:1.6;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--charcoal);color:#fff}
.container{width:100%;max-width:1240px;margin-inline:auto;padding-inline:1rem}
@media(min-width:640px){.container{padding-inline:1.5rem}}
.kicker{font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gray-1)}
.icon{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-weight:800;font-size:.85rem;border-radius:.7rem;padding:.7rem 1.15rem;transition:all .2s;min-height:44px}
.btn-teal{background:linear-gradient(135deg,#45505a,#5d6a74);color:#fff;box-shadow:0 10px 22px -10px rgba(69,80,90,.85);transition:transform .2s,box-shadow .2s,filter .2s}
.btn-teal:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(69,80,90,.9)}
.btn-gold{background:linear-gradient(135deg,#f2bd66,#ffd282);color:#17323b;font-weight:800;box-shadow:0 10px 22px -10px rgba(242,189,102,.9);transition:transform .2s,box-shadow .2s,filter .2s}
.btn-gold:hover{filter:brightness(1.05);transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(242,189,102,.95)}
.btn-ghost{border:1px solid var(--bd-5);background:#fff;color:var(--ink)}
.btn-ghost:hover{background:var(--bg-tint)}
.btn-outline-w{border:1px solid rgba(51,57,62,.35);background:transparent;color:#33393e}
.btn-outline-w:hover{background:#33393e;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
/* ===== Topbar (light) ===== */
.topbar{background:#f2f4f5;border-bottom:1px solid #e4e7e9;color:#4b555d;padding:.45rem 0;font-size:.68rem}
.topbar .container{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.topbar-link{display:inline-flex;align-items:center;gap:.4rem;transition:color .2s}
.topbar-link:hover{color:#33393e}
.topbar .icon{width:.9em;height:.9em;color:#9a6b13}
.topbar-right{display:flex;align-items:center;gap:1rem}
.topbar .hidden-m{display:none}
@media(min-width:768px){.topbar .hidden-m{display:inline-flex}.topbar{font-size:.7rem}}
/* ===== Header ===== */
.header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);box-shadow:0 8px 22px -20px rgba(35,41,46,.6)}
.header-in{display:flex;align-items:center;gap:.6rem;min-height:70px;padding-block:.55rem}
.brand{display:flex;align-items:center;gap:.65rem;flex-shrink:0}
.brand img{width:44px;height:44px;border-radius:.8rem;object-fit:cover;box-shadow:0 0 0 1px var(--bd-3);transition:transform .35s}
.brand:hover img{transform:rotate(-8deg) scale(1.06)}
.brand-txt{display:none;line-height:1.25}
.brand-txt b{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--ink-2)}
.brand-txt span{display:block;font-size:.58rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#6a757d}
@media(min-width:640px){.brand-txt{display:block}}
.h-search{display:none;flex:1;position:relative}
@media(min-width:1024px){.h-search{display:block}}
.h-actions{margin-inline-start:auto;display:flex;align-items:center;gap:.4rem}
.h-btn{display:inline-flex;align-items:center;gap:.45rem;height:42px;padding-inline:.6rem;border-radius:.8rem;font-size:.75rem;font-weight:800;color:#626d74;transition:background .2s}
.h-btn:hover{background:var(--bg-tint)}
.h-btn .icon{width:1.15rem;height:1.15rem}
.cart-btn{position:relative;display:inline-flex;align-items:center;gap:.5rem;height:42px;padding-inline:.85rem;border-radius:.8rem;background:linear-gradient(135deg,#45505a,#5d6a74);color:#fff;font-size:.75rem;font-weight:800;box-shadow:0 10px 22px -10px rgba(69,80,90,.9);transition:transform .2s,filter .2s,box-shadow .2s}
.cart-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(69,80,90,.95)}
.cart-badge{display:grid;place-items:center;min-width:20px;height:20px;padding-inline:.25rem;border-radius:999px;background:var(--gold);color:#17323b;font-size:.62rem;font-weight:800}
.menu-btn{display:grid;place-items:center;width:42px;height:42px;border-radius:.8rem;border:1px solid #dee3e5;background:#fff}
@media(min-width:1024px){.menu-btn{display:none}}
/* Nav */
.nav-row{display:none;border-top:1px solid var(--bd-2);background:var(--bg-soft)}
@media(min-width:1024px){.nav-row{display:block}}
.nav-in{display:flex;align-items:center;justify-content:center;gap:.25rem;overflow-x:auto}
.nav-in a{position:relative;flex-shrink:0;padding:.8rem 1.1rem;font-size:.83rem;font-weight:800;color:#566169;transition:all .2s}
.nav-in a:hover{background:#fff;color:var(--charcoal-3)}
.nav-in a.active{color:var(--charcoal-3);background:linear-gradient(180deg,#f1f3f4,#fff)}
.nav-in a.active::after{content:"";position:absolute;bottom:0;inset-inline:1.1rem;height:3px;border-radius:99px;background:linear-gradient(to left,#45505a,#6e7981,#f2bd66)}
/* Search box */
.search-box{display:flex;align-items:center;gap:.55rem;height:44px;border:1px solid var(--bd-4);border-radius:.8rem;background:var(--bg-soft);padding-inline:.9rem;transition:all .2s}
.search-box:focus-within{border-color:var(--charcoal);background:#fff;box-shadow:0 0 0 3px rgba(69,80,90,.12)}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:.82rem;min-width:0}
.search-box .icon{color:#626d74;width:1.05rem;height:1.05rem}
.search-drop{position:absolute;top:calc(100% + .5rem);inset-inline:0;background:#fff;border:1px solid var(--bd);border-radius:1rem;box-shadow:0 24px 48px -20px rgba(35,41,46,.35);overflow:hidden;z-index:60;max-height:26rem;overflow-y:auto;animation:fadeUp .22s ease}
.search-drop .sd-item{display:flex;gap:.75rem;align-items:center;padding:.65rem .9rem;transition:background .15s;cursor:pointer;border-bottom:1px solid var(--bd-2)}
.search-drop .sd-item:hover{background:var(--bg-tint)}
.search-drop img{width:44px;height:44px;border-radius:.55rem;object-fit:cover;flex-shrink:0}
.sd-t{font-size:.8rem;font-weight:800;color:var(--ink);line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.sd-c{font-size:.66rem;font-weight:800;color:var(--gray-1);margin-top:.15rem}
.sd-empty{padding:1.4rem;text-align:center;font-size:.8rem;color:var(--mut)}
.m-search{display:none;border-top:1px solid var(--bd-2);background:#fafbfc;padding-block:.75rem}
.m-search.show{display:block}
@media(min-width:1024px){.m-search{display:none!important}}
/* Mobile menu */
.mmenu{position:fixed;inset:0;z-index:70;background:rgba(30,35,40,.5);backdrop-filter:blur(3px);padding:.75rem;display:none}
.mmenu.show{display:flex;align-items:flex-start;justify-content:center}
.mmenu-card{width:100%;max-width:28rem;max-height:100%;overflow-y:auto;background:#fff;border-radius:1.35rem;padding:1.25rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.mmenu-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4e8ea;padding-bottom:1rem}
.mmenu-head .kicker{color:#6a757d}
.mmenu-head b{font-family:var(--font-display);font-size:1.25rem;display:block;margin-top:.2rem}
.mmenu-close{display:grid;place-items:center;width:40px;height:40px;border-radius:999px;background:#eef1f3;color:var(--charcoal-3)}
.mmenu nav{display:grid;gap:.2rem;padding-block:1.1rem}
.mmenu nav a{border-radius:.8rem;padding:.75rem 1rem;font-size:.85rem;font-weight:800;color:#454f57}
.mmenu nav a:hover{background:var(--bg-tint)}
.mmenu nav a.on{background:var(--bg-tint-2);color:var(--charcoal-3)}
/* ===== Hero ===== */
.hero{background:var(--bg-hero);position:relative;padding-block:1.25rem}
.hero-frame{border-radius:1.5rem;overflow:hidden;border:1px solid #dde2e5;background:#fff;box-shadow:0 34px 68px -34px rgba(35,41,46,.45);animation:fadeUp .6s ease}
.hero-stage{position:relative;min-height:340px;overflow:hidden}
@media(min-width:640px){.hero-stage{min-height:440px}}
.hero-stage::after{content:"";position:absolute;inset-inline:0;bottom:0;height:62%;background:linear-gradient(to top,rgba(30,35,40,.82),rgba(30,35,40,.25) 55%,transparent);pointer-events:none;z-index:5}
.hero-overlay{position:absolute;inset-inline:0;bottom:0;z-index:15;padding:1.35rem 1.4rem 1.5rem;pointer-events:none;max-width:44rem}
@media(min-width:640px){.hero-overlay{padding:1.75rem 2rem 2rem}}
.h-badge{display:inline-flex;align-items:center;gap:.4rem;background:linear-gradient(135deg,#f2bd66,#ffce85);color:#17323b;font-size:.64rem;font-weight:900;letter-spacing:.05em;padding:.38rem .85rem;border-radius:999px;text-transform:uppercase;box-shadow:0 8px 22px -8px rgba(242,189,102,.9);animation:heroUp .5s .05s backwards}
.hero-overlay h1{font-family:var(--font-display);font-size:clamp(1.35rem,4vw,2.5rem);line-height:1.32;color:#fff;text-shadow:0 4px 26px rgba(20,24,28,.7);margin-top:.6rem;animation:heroUp .55s .12s backwards}
.hero-overlay p{margin-top:.45rem;font-size:clamp(.75rem,1.6vw,.92rem);font-weight:600;color:rgba(255,255,255,.94);text-shadow:0 2px 14px rgba(20,24,28,.8);max-width:34rem;line-height:1.8;animation:heroUp .55s .2s backwards}
.hero-cta{margin-top:1.05rem;pointer-events:auto;animation:heroUp .55s .28s backwards}
@keyframes heroUp{from{opacity:0;transform:translateY(16px)}}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .55s ease,transform .55s ease;transform:scale(1.02)}
.hero-slide.on{opacity:1;transform:scale(1)}
.hero-slide img{width:100%;height:100%;object-fit:cover;background:var(--bg-hero)}
.hero-logo{position:absolute;inset-inline-end:1rem;top:1rem;z-index:20;background:rgba(40,46,51,.9);border:1px solid rgba(255,255,255,.3);border-radius:.8rem;padding:.35rem;box-shadow:0 10px 28px -12px rgba(20,24,28,.85);backdrop-filter:blur(4px)}
.hero-logo img{width:46px;height:46px;border-radius:.55rem;object-fit:cover}
@media(min-width:640px){.hero-logo{inset-inline-end:1.5rem;top:1.5rem}.hero-logo img{width:52px;height:52px}}
.hero-ctrl{border-top:1px solid #e0e4e7;background:#fff}
.hero-ctrl .container{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:56px;padding-block:.5rem}
.hero-dots{display:flex;align-items:center;gap:.45rem}
.hero-dots button{height:6px;width:16px;border-radius:999px;background:#c6cdd2;transition:all .3s}
.hero-dots button:hover{background:#a4aeb5}
.hero-dots button.on{width:38px;background:linear-gradient(90deg,#45505a,#6e7981)}
.hero-arrows{display:flex;gap:.4rem}
.hero-arrows button{display:grid;place-items:center;width:36px;height:36px;border-radius:.45rem;border:1px solid var(--bd-5);background:#fff;color:var(--ink);transition:background .2s}
.hero-arrows button:hover{background:var(--bg-tint)}
.hero-arrows .icon{width:1rem;height:1rem}
/* ===== Marquee (light) ===== */
.marquee{background:#f4f6f7;border-block:1px solid #e4e7e9;color:#4b555d;padding-block:.6rem;overflow:hidden}
.marquee-in{display:flex;white-space:nowrap;width:max-content;animation:marq 30s linear infinite}
[dir=rtl] .marquee-in{animation-name:marqR}
.marquee-in span{display:inline-flex;align-items:center;gap:.55rem;margin-inline-end:2.75rem;font-size:.72rem;font-weight:800;letter-spacing:.02em}
.marquee-in .icon{color:#9a6b13;width:1rem;height:1rem}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes marqR{from{transform:translateX(0)}to{transform:translateX(50%)}}
/* ===== Category rail ===== */
.cat-rail{background:#fff;border-bottom:1px solid #e5e8ea}
.cat-rail .container{padding-block:1.75rem}
.rail-scroll{display:flex;gap:.8rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:thin}
.rail-scroll::-webkit-scrollbar{height:6px}
.rail-scroll::-webkit-scrollbar-thumb{background:#d0d6da;border-radius:99px}
.cat-card{flex:0 0 162px;display:flex;flex-direction:column;gap:.55rem;background:#fff;border:1px solid var(--bd-4);border-radius:1.15rem;padding:1rem .9rem;transition:all .25s;cursor:pointer}
.cat-card:hover{border-color:#f0c87e;background:#fffdf6;box-shadow:0 20px 34px -22px rgba(35,41,46,.5);transform:translateY(-4px)}
.cat-ico{display:grid;place-items:center;width:46px;height:46px;border-radius:1rem;color:#fff;box-shadow:0 10px 20px -10px rgba(35,41,46,.55);transition:transform .3s}
.cat-card:hover .cat-ico{transform:scale(1.12) rotate(-6deg)}
.cat-card:nth-child(8n+1) .cat-ico{background:linear-gradient(135deg,#8d98a0,#6e7981)}
.cat-card:nth-child(8n+2) .cat-ico{background:linear-gradient(135deg,#b0bac1,#939ea5)}
.cat-card:nth-child(8n+3) .cat-ico{background:linear-gradient(135deg,#7e8991,#5f6a72)}
.cat-card:nth-child(8n+4) .cat-ico{background:linear-gradient(135deg,#aab4bb,#8d98a0)}
.cat-card:nth-child(8n+5) .cat-ico{background:linear-gradient(135deg,#6f7a82,#525d65)}
.cat-card:nth-child(8n+6) .cat-ico{background:linear-gradient(135deg,#99a4ab,#7a8590)}
.cat-card:nth-child(8n+7) .cat-ico{background:linear-gradient(135deg,#868f96,#67717a)}
.cat-card:nth-child(8n+8) .cat-ico{background:linear-gradient(135deg,#b7c0c6,#9aa5ac)}
.cat-ico .icon{width:1.25rem;height:1.25rem}
.cat-t{font-size:.8rem;font-weight:800;color:var(--ink);line-height:1.35}
.cat-d{font-size:.66rem;color:var(--mut-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cat-n{display:inline-block;align-self:flex-start;font-size:.6rem;font-weight:800;color:#45505a;background:var(--bg-tint-3);border-radius:999px;padding:.14rem .6rem;margin-top:.15rem}
/* ===== Benefits ===== */
.benefits{background:var(--bg-cream)}
.benefits .container{display:grid;gap:0}
@media(min-width:640px){.benefits .container{grid-template-columns:repeat(3,1fr)}}
.benefit{display:flex;align-items:center;gap:.8rem;padding-block:1.25rem;border-bottom:1px solid #e5e8ea}
.benefit:last-child{border-bottom:none}
@media(min-width:640px){.benefit{border-bottom:none;border-inline-end:1px solid #e5e8ea;padding-inline:1.5rem}.benefit:first-child{padding-inline-start:0}.benefit:last-child{border-inline-end:none}}
.benefit .b-ico{display:grid;place-items:center;width:46px;height:46px;border-radius:1.1rem;color:#fff;flex-shrink:0;box-shadow:0 10px 22px -12px rgba(35,41,46,.6)}
.benefit:nth-child(1) .b-ico{background:linear-gradient(135deg,#8d98a0,#6e7981)}
.benefit:nth-child(2) .b-ico{background:linear-gradient(135deg,#b0bac1,#939ea5)}
.benefit:nth-child(3) .b-ico{background:linear-gradient(135deg,#7e8991,#5f6a72)}
.benefit h3{font-size:.83rem;font-weight:800;color:var(--ink)}
.benefit p{font-size:.7rem;color:var(--mut-3);margin-top:.2rem}
/* ===== Product sections ===== */
.sec{padding-block:2.4rem}
.sec-muted{background:var(--bg-cream)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.4rem}
.sec-head .kicker{display:inline-flex;align-items:center;gap:.55rem}
.sec-head .kicker::before{content:"";width:1.7rem;height:3.5px;border-radius:99px;background:linear-gradient(to left,#45505a,#6e7981,#f2bd66)}
.sec-head h2{font-family:var(--font-display);font-size:clamp(1.3rem,3vw,1.75rem);color:var(--ink);margin-top:.35rem;line-height:1.3}
.sec-head .sub{font-size:.8rem;color:var(--mut-2);margin-top:.4rem;max-width:38rem}
.view-all{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:800;color:var(--charcoal-3);white-space:nowrap;padding:.5rem .75rem;border-radius:.6rem;transition:background .2s}
.view-all:hover{background:var(--bg-tint-2)}
.prod-rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(215px,1fr);gap:1rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:thin}
.prod-rail::-webkit-scrollbar{height:6px}
.prod-rail::-webkit-scrollbar-thumb{background:#d0d6da;border-radius:99px}

@media(max-width:640px){

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.rv{opacity:0;transform:translateY(18px)}

.fab{position:fixed;inset-inline-end:1.15rem;z-index:55;display:grid;place-items:center;width:52px;height:52px;border-radius:999px;transition:transform .25s,box-shadow .25s,opacity .3s;box-shadow:0 16px 34px -12px rgba(30,35,40,.5)}

.fab-top{bottom:5.7rem;background:linear-gradient(135deg,#33393e,#45505a);color:var(--gold);opacity:0;pointer-events:none;transform:translateY(12px)}

function money(v){
  if(v===null || v===undefined || v==="") return null;
  const n = Number(v);
  if(isNaN(n)) return null;
  return isAr() ? n.toLocaleString("en-US") + " د.إ" : "AED " + n.toLocaleString("en-US");
}
function prod(id){ return DATA.products.find(p=>p.id===id); }
function cat(id){ return DATA.categories.find(c=>c.id===id); }
function catBySlug(s){ return DATA.categories.find(c=>c.slug===s); }
function prodBySlug(s){ return DATA.products.find(p=>p.slug===s); }

function P(p){
  const ov = OVERRIDES[p.id];
  if(!ov) return { ...p, price:p.p, feat:p.f, avail:p.ok };
  return { ...p, price: ("p" in ov ? (ov.p===""?null:ov.p) : p.p), feat: ("f" in ov ? ov.f : p.f), avail: ("ok" in ov ? ov.ok : p.ok) };
}
function allProducts(){ return DATA.products.map(P); }
function catCount(cid){ return DATA.products.filter(p=>p.cid===cid).length; }

const ic = (n, cls) => '<svg class="icon'+(cls?" "+cls:"")+'" viewBox="0 0 24 24">'+ICONS[n]+'</svg>';

/* ================= TOAST ================= */
function toast(msg, err){
  const el = document.createElement("div");
  el.className = "toast"+(err?" err":"");
  el.innerHTML = ic(err?"info":"check") + "<span>"+esc(msg)+"</span>";
  $("#toasts").appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),320); }, 2600);
}

/* ================= FAVORITES ================= */
function toggleFav(id){
  const i = FAVS.indexOf(id);
  if(i>-1) FAVS.splice(i,1); else FAVS.push(id);
  saveAll(); renderFavBadge();
  document.querySelectorAll('[data-fav="'+id+'"]').forEach(b=>b.classList.toggle("on", FAVS.includes(id)));
}
function renderFavBadge(){
  const b = $("#favBadge");
  b.style.display = FAVS.length ? "grid" : "none";
  b.textContent = FAVS.length;
}
</script>

<script>
"use strict";
/* ================= CART ================= */
function cartAdd(id, qty){
  const item = CART.find(i=>i.id===id);
  if(item) item.qty += (qty||1); else CART.push({id, qty: qty||1});
  saveAll(); renderCartBtn(); toast(t("added"));
}
function cartSet(id, qty){
  const item = CART.find(i=>i.id===id);
  if(!item) return;
  if(qty<1){ CART = CART.filter(i=>i.id!==id); } else item.qty = qty;
  saveAll(); renderCartBtn(); renderDrawer();
}
function cartRemove(id){ CART = CART.filter(i=>i.id!==id); saveAll(); renderCartBtn(); renderDrawer(); }
function cartClear(){ CART = []; saveAll(); renderCartBtn(); renderDrawer(); }
function cartCount(){ return CART.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return CART.reduce((s,i)=>{ const p=P(prod(i.id)||{}); return s + (Number(p.price||0)*i.qty); },0); }
function renderCartBtn(){
  const b = $("#cartBadge");
  b.style.display = cartCount() ? "grid" : "none";
  b.textContent = cartCount();
}
let checkoutMode = false;
function openCart(){ checkoutMode = false; $("#drawer").classList.add("show"); $("#overlay").classList.add("show"); renderDrawer(); }
function closeCart(){ $("#drawer").classList.remove("show"); $("#overlay").classList.remove("show"); }
function renderDrawer(){
  $("#drawerTitle").textContent = checkoutMode ? t("sendTitle") : t("cartTitle");
  $("#drawerSub").textContent = cartCount() + " " + t("itemsSel");
  const body = $("#drawerBody"), foot = $("#drawerFoot");
  if(!CART.length){
    body.innerHTML = '<div class="empty-state" style="padding:3rem 1rem"><div class="e-ico">'+ic("bag")+'</div><h3>'+t("cartEmpty")+'</h3><p>'+t("cartEmptySub")+'</p><button class="btn btn-ghost" style="margin-top:1.4rem" onclick="closeCart();nav(\'#/shop\')">'+t("browse")+'</button></div>';
    foot.innerHTML = ""; return;
  }
  if(checkoutMode){
    body.innerHTML =
      '<form class="checkout-form" id="coForm" onsubmit="submitOrder(event)">' +
      '<div class="sum-box"><b>'+t("prodSummary")+'</b>' +
      CART.map(i=>{ const p=P(prod(i.id)); return '<div class="sum-row"><span>'+esc(L(p))+' × '+i.qty+'</span><span>'+(money(p.price)?money(p.price):"")+'</span></div>'; }).join("") +
      (cartTotal()? '<div class="sum-row" style="font-weight:800;color:var(--ink)"><span>'+t("estTotal")+'</span><span>'+money(cartTotal())+'</span></div>':"") +
      '</div>' +
      '<input class="fld" id="coName" required placeholder="'+t("namePh")+'">' +
      '<input class="fld" id="coPhone" required inputmode="tel" placeholder="'+t("phonePh")+'">' +
      '<textarea class="fld" id="coNotes" placeholder="'+t("notesPh")+'"></textarea>' +
      '<p style="font-size:.68rem;line-height:1.8;color:var(--mut)">'+t("submitNote")+'</p>' +
      '<button type="submit" class="btn btn-teal" style="width:100%">'+ic("whatsapp")+t("submitBtn")+'</button>' +
      '<button type="button" class="back-link" onclick="checkoutMode=false;renderDrawer()">'+t("backCart")+'</button>' +
      '</form>';
    foot.innerHTML = ""; return;
  }
  body.innerHTML = CART.map(i=>{
    const raw = prod(i.id); if(!raw) return "";
    const p = P(raw);
    return '<article class="ci">' +
      '<img src="'+esc(p.img||FALLBACK_IMG)+'" alt="'+esc(L(p))+'" loading="lazy">' +
      '<div class="ci-m"><div class="ci-top"><h3>'+esc(L(p))+'</h3><button class="ci-del" onclick="cartRemove('+p.id+')" aria-label="remove">'+ic("trash")+'</button></div>' +
      '<p class="ci-price">'+(money(p.price)?money(p.price):t("onConfirm"))+'</p>' +
      '<div class="ci-row"><div class="qty-sm"><button onclick="cartSet('+p.id+','+(i.qty-1)+')">'+ic("minus")+'</button><span>'+i.qty+'</span><button onclick="cartSet('+p.id+','+(i.qty+1)+')">'+ic("plus")+'</button></div>' +
      '<span class="ci-total">'+(money(p.price)?money(p.price*i.qty):"")+'</span></div></div></article>';
  }).join("");
  foot.innerHTML =
    '<div class="cart-sum"><span>'+t("estTotal")+'</span><strong>'+(cartTotal()?money(cartTotal()):t("onRequest"))+'</strong></div>' +
    '<p class="cart-note">'+t("cartFootNote")+'</p>' +
    '<button class="btn btn-teal" style="width:100%;margin-top:.9rem" onclick="checkoutMode=true;renderDrawer()">'+t("continueSend")+'</button>' +
    '<button class="cart-clear" onclick="cartClear()">'+t("clearCart")+'</button>';
}
function submitOrder(ev){
  ev.preventDefault();
  const name = $("#coName").value.trim(), phone = $("#coPhone").value.trim(), notes = $("#coNotes").value.trim();
  const btn = ev.target.querySelector('button[type="submit"]');
  btn.disabled = true; btn.innerHTML = t("sending");
  setTimeout(()=>{
    const oid = "R" + Date.now().toString(36).toUpperCase().slice(-6);
    ORDERS.unshift({ id:oid, name, phone, notes, items: CART.map(i=>({id:i.id, qty:i.qty})), total: cartTotal(), status:"new", date: Date.now(), lang: LANG });
    saveAll();
    const lines = CART.map(i=>{ const p=P(prod(i.id)); return "• " + L(p) + " × " + i.qty; }).join("\n");
    const msg = isAr()
      ? "مرحباً مطبعة الروعة، أرسلت سلة طلب جديدة ("+oid+")\nالاسم: "+name+"\nالهاتف: "+phone+"\n\nالمنتجات:\n"+lines+"\n\nالتفاصيل: "+(notes||"—")
      : "Hello Al Rawaa Printing, I sent a new request cart ("+oid+")\nName: "+name+"\nPhone: "+phone+"\n\nProducts:\n"+lines+"\n\nNotes: "+(notes||"—");
    window.open("https://wa.me/"+SETTINGS.whatsapp+"?text="+encodeURIComponent(msg), "_blank", "noopener");
    toast(t("submitted"));
    cartClear(); checkoutMode = false; closeCart();
  }, 500);
}

/* ================= COMPONENTS ================= */
function productCard(p, extraCls, delay){
  const c = cat(p.cid);
  const fav = FAVS.includes(p.id);
  const price = money(p.price);
  return '<article class="pc rv'+(!p.avail?" unavail":"")+(extraCls||"")+'"'+(delay?' style="animation-delay:'+delay+'ms"':'')+'>' +
    '<a class="pc-img" href="#/product/'+p.slug+'">' +
      '<img src="'+esc(p.img||FALLBACK_IMG)+'" alt="'+esc(L(p))+'" loading="lazy" decoding="async">' +
      (p.feat?'<span class="pc-pick">'+ic("Sparkles")+t("pick")+'</span>':"") +
      '<span class="pc-shade"></span>' +
    '</a>' +
    '<button class="pc-fav'+(fav?" on":"")+'" data-fav="'+p.id+'" onclick="toggleFav('+p.id+')" aria-label="fav">'+ic("heart")+'</button>' +
    '<div class="pc-body">' +
      '<p class="pc-cat">'+esc(c?L(c):t("madeToOrder"))+'</p>' +
      '<a class="pc-t" href="#/product/'+p.slug+'">'+esc(L(p))+'</a>' +
      '<div class="pc-foot">' +
        (p.avail
          ? (price?'<strong class="pc-price">'+price+'</strong>':'<span class="pc-price req">'+t("onRequest")+'</span>')
          : '<span class="pc-price req" style="color:#a36b6b">'+t("unavailable")+'</span>') +
        (p.avail?'<button class="pc-add" onclick="cartAdd('+p.id+')">'+ic("bag")+t("add")+'</button>':"") +
      '</div>' +
    '</div>' +
    '<span class="pc-line"></span>' +
  '</article>';
}
function sectionHead(eyebrow, title, sub, viewAllHref){
  return '<div class="sec-head rv"><div><p class="kicker">'+esc(eyebrow)+'</p><h2>'+esc(title)+'</h2>'+(sub?'<p class="sub">'+esc(sub)+'</p>':"")+'</div>' +
    (viewAllHref?'<a class="view-all" href="'+viewAllHref+'">'+t("viewAll")+(isAr()?ic("chevL"):ic("chevR"))+'</a>':"")+'</div>';
}
function productRail(items){
  return '<div class="prod-rail">'+items.map((p,i)=>productCard(p, "", (i%8)*50)).join("")+'</div>';
}

/* ================= VIEW: HOME ================= */
let heroIdx = 0, heroTimer = null, heroPaused = false;
function marqueeView(){
  const items = [
    ["truck", isAr()?"توصيل لجميع الإمارات":"Delivery across the UAE"],
    ["Sparkles", isAr()?"تصاميم حسب الطلب":"Made-to-order designs"],
    ["check", isAr()?"جودة في كل تفصيلة":"Quality in every detail"],
    ["Gift", isAr()?"هدايا بطابعك الخاص":"Gifts with your personal touch"],
    ["phone", isAr()?"تواصل سريع عبر واتساب":"Fast WhatsApp support"],
  ];
  const seq = items.map(x=>'<span>'+ic(x[0])+esc(x[1])+'</span>').join("");
  return '<div class="marquee" aria-hidden="true"><div class="marquee-in">'+seq+seq+'</div></div>';
}
function homeView(){
  const cats = DATA.categories.filter(c=>c.active);
  const prods = allProducts().filter(p=>p.avail);
  const featured = prods.filter(p=>p.feat).slice(0,10);
  const featList = featured.length ? featured : prods.slice(0,10);
  const sections = ["occasion-stationery","boxes-packaging","custom-printing","stickers-labels","paper-bags","promotional-gifts"];
  const sectionEls = sections.map(slug=>{
    const c = catBySlug(slug); if(!c) return "";
    const copy = I18N.sections[slug];
    const items = prods.filter(p=>p.cid===c.id).sort((a,b)=>a.o-b.o).slice(0,10);
    if(!items.length) return "";
    return '<section class="sec'+(copy.muted?" sec-muted":"")+'"><div class="container">' +
      sectionHead(L(copy.e), L(copy.t), L(copy.s), "#/shop?cat="+slug) + productRail(items) + '</div></section>';
  });
  const first2 = sectionEls.slice(0,2).join(""), rest = sectionEls.slice(2).join("");
  const bundles = prods.filter(p=>p.cid===3).sort((a,b)=>a.o-b.o).slice(0,10);

  return '' +
  '<section class="hero"><div class="container"><div class="hero-frame"><div class="hero-stage" id="heroStage">' +
    DATA.heroSlides.map((s,i)=>'<div class="hero-slide'+(i===0?" on":"")+'"><img src="'+esc(s.img||FALLBACK_IMG)+'" alt="'+esc(isAr()?s.tAr:s.tEn||"")+'" decoding="async"></div>').join("") +
    '<div class="hero-logo"><img src="'+esc(DATA.logo||FALLBACK_IMG)+'" alt="logo"></div>' +
    '<div class="hero-overlay"><span class="h-badge" id="heroBadge"></span><h1 id="heroTitle"></h1><p id="heroSub"></p><a class="btn btn-gold hero-cta" href="#/shop">'+t("shopNow")+ic(isAr()?"arrowUpLeft":"arrowUpRight")+'</a></div>' +
  '</div>' +
  '<div class="hero-ctrl"><div class="container">' +
    '<div class="hero-dots" id="heroDots">'+DATA.heroSlides.map((s,i)=>'<button class="'+(i===0?"on":"")+'" onclick="heroGo('+i+')" aria-label="slide '+(i+1)+'"></button>').join("")+'</div>' +
    '<div class="hero-arrows">' +
      '<button onclick="heroGo(heroIdx-1)" aria-label="prev">'+ic("chevR")+'</button>' +
      '<button onclick="heroGo(heroIdx+1)" aria-label="next">'+ic("chevL")+'</button>' +
      '<button onclick="heroTogglePause()" id="heroPauseBtn" aria-label="pause">'+ic("pause")+'</button>' +
    '</div>' +
  '</div></div></div></div></section>' +
  marqueeView() +

  '<section class="cat-rail"><div class="container">' +
    '<div class="sec-head" style="margin-bottom:1rem"><div><p class="kicker">'+(isAr()?"تصفح الأقسام":"BROWSE CATEGORIES")+'</p><h2>'+(isAr()?"أقسام المتجر":"Shop by category")+'</h2></div></div>' +
    '<div class="rail-scroll">' + cats.map((c,ci)=>
      '<a class="cat-card rv" style="animation-delay:'+(ci*55)+'ms" href="#/shop?cat='+c.slug+'"><span class="cat-ico">'+ic(c.icon)+'</span><span class="cat-t">'+esc(L(c))+'</span><span class="cat-d">'+esc(L({ar:c.dAr,en:c.dEn}))+'</span><span class="cat-n">'+catCount(c.id)+' '+(isAr()?"منتجاً":"products")+'</span></a>'
    ).join("") + '</div>' +
  '</div></section>' +

  '<section class="benefits"><div class="container">' + I18N.benefits.map((b,bi)=>
    '<article class="benefit rv" style="animation-delay:'+(bi*90)+'ms"><span class="b-ico">'+ic(b.i)+'</span><div><h3>'+L(b.t)+'</h3><p>'+L(b.d)+'</p></div></article>'
  ).join("") + '</div></section>' +

  '<section class="sec"><div class="container">' + sectionHead(L(I18N.featured.e), L(I18N.featured.t), L(I18N.featured.s), "#/shop") + productRail(featList) + '</div></section>' +
  first2 +

  '<section class="sec-muted"><div class="container promo-wrap"><div class="promo rv">' +
    '<div class="promo-txt"><p class="kicker">'+L(I18N.promo.kicker)+'</p><h2>'+L(I18N.promo.title)+'</h2><p>'+L(I18N.promo.body)+'</p>' +
    '<div class="promo-btns"><a class="btn btn-gold" href="https://wa.me/'+SETTINGS.whatsapp+'" target="_blank" rel="noreferrer">'+ic("whatsapp")+L(I18N.promo.cta)+'</a><a class="btn btn-outline-w" href="#/shop?cat=boxes-packaging">'+L(I18N.promo.cta2)+'</a></div></div>' +
    '<div class="promo-img"><img src="'+esc(DATA.promo||FALLBACK_IMG)+'" alt="promo" loading="lazy"></div>' +
  '</div></div></section>' +

  (bundles.length? '<section class="sec"><div class="container">' + sectionHead(L(I18N.bundles.e), L(I18N.bundles.t), L(I18N.bundles.s), "#/shop?cat=boxes-packaging") + productRail(bundles) + '</div></section>':"") +

  rest +

  '<section class="sec-muted"><div class="container idea rv">' +
    '<div><p class="kicker">'+L(I18N.idea.kicker)+'</p><h2>'+L(I18N.idea.title)+'</h2><p>'+L(I18N.idea.body)+'</p></div>' +
    '<a class="btn btn-teal" style="height:46px;padding-inline:1.4rem" href="https://wa.me/'+SETTINGS.whatsapp+'" target="_blank" rel="noreferrer">'+L(I18N.idea.cta)+(isAr()?ic("arrowUpLeft"):ic("arrowUpRight"))+'</a>' +
  '</div></section>';
}
function heroGo(i){
  const slides = document.querySelectorAll(".hero-slide"); if(!slides.length) return;
  heroIdx = (i + slides.length) % slides.length;
  slides.forEach((s,j)=>s.classList.toggle("on", j===heroIdx));
  document.querySelectorAll("#heroDots button").forEach((d,j)=>d.classList.toggle("on", j===heroIdx));
  const s = DATA.heroSlides[heroIdx];
  const badge = $("#heroBadge"), title = $("#heroTitle"), sub = $("#heroSub");
  if(badge && s){
    badge.textContent = isAr()?s.bAr:s.bEn;
    title.textContent = isAr()?s.tAr:s.tEn;
    sub.textContent = isAr()?s.sAr:s.sEn;
    [badge,title,sub].forEach(el=>{ el.style.animation="none"; void el.offsetHeight; el.style.animation=""; });
  }
}
function heroTogglePause(){
  heroPaused = !heroPaused;
  $("#heroPauseBtn").innerHTML = ic(heroPaused?"play":"pause");
  if(!heroPaused) heroStart();
}
function heroStart(){
  clearInterval(heroTimer);
  if(!heroPaused) heroTimer = setInterval(()=>heroGo(heroIdx+1), 4500);
}

/* ================= VIEW: SHOP ================= */

function shopView(params){
  shopState = { cat: params.cat||null, q: params.q||"", sort: params.sort||"def", shown: 24 };
  return '<div class="container"><div class="shop-layout">' +
    '<aside class="shop-side"><h3>'+(isAr()?"الأقسام":"Categories")+'</h3><div id="catFilters">' +

      DATA.categories.map(c=>{ const th=(DATA.products.find(p=>p.cid===c.id&&p.img)||{}).img; return '<button class="cat-filter'+(shopState.cat===c.slug?" on":"")+'" onclick="nav(\'#/shop?cat='+c.slug+'\')">'+(th?'<img class="cf-thumb" src="'+esc(th)+'" alt="" loading="lazy">':'')+'<span>'+esc(L(c))+'</span><span class="n">'+catCount(c.id)+'</span></button>'; }).join("") +
    '</div></aside>' +
    '<div><div class="shop-toolbar">' +
      '<span class="shop-count" id="shopCount"></span>' +
      '<div class="search-box"><svg class="icon" viewBox="0 0 24 24">'+ICONS.search+'</svg><input id="shopSearch" type="search" value="'+esc(shopState.q)+'" placeholder="'+t("searchPh")+'"></div>' +
      '<select class="sort-sel" id="shopSort">' +
        '<option value="def">'+t("sortDef")+'</option>' +
        '<option value="pu">'+t("sortPriceUp")+'</option>' +
        '<option value="pd">'+t("sortPriceDown")+'</option>' +
        '<option value="name">'+t("sortName")+'</option>' +
      '</select>' +
    '</div><div class="grid-products" id="shopGrid"></div></div>' +
  '</div></div>';
}
function shopApply(){
  const grid = $("#shopGrid"); if(!grid) return;
  let list = allProducts();
  if(shopState.cat){ const c = catBySlug(shopState.cat); if(c) list = list.filter(p=>p.cid===c.id); }
  if(shopState.q){
    const q = shopState.q.toLowerCase();
    list = list.filter(p=> (p.ar||"").toLowerCase().includes(q) || (p.en||"").toLowerCase().includes(q) || (p.dAr||"").toLowerCase().includes(q) || (p.dEn||"").toLowerCase().includes(q));
  }
  if(shopState.sort==="pu") list = list.slice().sort((a,b)=>(a.price??1e12)-(b.price??1e12));
  else if(shopState.sort==="pd") list = list.slice().sort((a,b)=>(b.price??-1)-(a.price??-1));
  else if(shopState.sort==="name") list = list.slice().sort((a,b)=>L(a).localeCompare(L(b), isAr()?"ar":"en"));
  else list = list.slice().sort((a,b)=>a.o-b.o);
  $("#shopCount").textContent = isAr() ? (list.length + " " + (list.length===1?"منتج":"منتجاً")) : (list.length + " products");
  const slice = list.slice(0, shopState.shown);
  if(!list.length){
    grid.innerHTML = '<div class="empty-state"><div class="e-ico">'+ic("search")+'</div><h3>'+t("shopNoFound")+'</h3><p>'+t("shopNoFoundSub")+'</p></div>';
    return;
  }
  grid.innerHTML = slice.map((p,i)=>productCard(p, "", (i%8)*45)).join("") +
    (list.length>shopState.shown ? '<div class="load-more" style="grid-column:1/-1"><button class="btn btn-ghost" onclick="shopState.shown+=24;shopApply();wireReveal()">'+t("loadMore")+'</button></div>' : "");
  wireReveal();
  const sel = $("#shopSort"); if(sel) sel.value = shopState.sort;
  const inp = $("#shopSearch"); if(inp){ inp.oninput = ()=>{ shopState.q = inp.value; shopState.shown = 24; shopApply(); }; }
}

/* ================= VIEW: PRODUCT ================= */

  const raw = prodBySlug(slug);

  const p = P(raw); const c = cat(p.cid);

  const related = allProducts().filter(x=>x.cid===p.cid && x.id!==p.id && x.avail).sort((a,b)=>a.o-b.o).slice(0,8);
  return '<div class="container">' +
    '<nav class="crumbs"><a href="#/">'+t("home")+'</a>'+ic(isAr()?"chevL":"chevR")+(c?'<a href="#/shop?cat='+c.slug+'">'+esc(L(c))+'</a>'+ic(isAr()?"chevL":"chevR"):"")+'<span>'+esc(L(p))+'</span></nav>' +
    '<div class="pd">' +
      '<div class="pd-img">'+(p.feat?'<span class="pc-pick">'+ic("Sparkles")+t("pick")+'</span>':"")+'<img src="'+esc(p.img||FALLBACK_IMG)+'" alt="'+esc(L(p))+'"></div>' +
      '<div class="pd-info">' +

        '<h1>'+esc(L(p))+'</h1>' +

          (p.avail ? (price?'<span class="pd-price">'+price+'</span>':'<span class="pd-price req">'+t("onRequest")+'</span>') : '<span class="pd-price req" style="background:#fbe9e9;color:#a33">'+t("unavailable")+'</span>') +
          '<span class="pd-cat-tag">'+ic("Sparkles")+esc(c?L(c):t("madeToOrder"))+'</span>' +

          '<a class="btn btn-ghost" href="https://wa.me/'+SETTINGS.whatsapp+'?text='+encodeURIComponent((isAr()?"مرحباً، أستفسر عن: ":"Hello, I'm asking about: ")+L(p))+'" target="_blank" rel="noreferrer">'+ic("whatsapp")+t("waOrder")+'</a></div>'
        : "") +

function pdQty(d){ const el = $("#pdQtyV"); const v = Math.max(1, Number(el.textContent)+d); el.textContent = v; }

<script>

function gateTry(){
  const v = $("#gateInput").value.trim();

}
function adminBody(){
  if(adminTab==="dash") return adminDash();
  if(adminTab==="products") return adminProducts();
  if(adminTab==="orders") return adminOrders();
  if(adminTab==="settings") return adminSettings();
  return "";
}
function adminDash(){
  const newOrders = ORDERS.filter(o=>o.status==="new").length;
  const stat = (icon, val, label)=>'<div class="stat"><div class="st-ico">'+ic(icon)+'</div><b>'+val+'</b><span>'+label+'</span></div>';
  return '<div class="stats">' +
    stat("list", DATA.products.length, t("stProducts")) +
    stat("grid", DATA.categories.length, t("stCats")) +
    stat("bag", ORDERS.length, t("stOrders")) +
    stat("clock", newOrders, t("stNew")) +
  '</div>' +
  '<div class="admin-card"><h2>'+ic("clock")+t("recentOrders")+'</h2><p class="ac-sub">'+t("admWelcome")+'</p>' +
    (ORDERS.length ? adminOrdersTable(ORDERS.slice(0,5), true) : '<div class="empty-state" style="padding:2.5rem 1rem"><div class="e-ico">'+ic("bag")+'</div><p>'+t("noOrders")+'</p></div>') +
  '</div>';
}
let admQ = "", admCat = 0;
function adminProducts(){
  return '<div class="admin-card">' +
    '<h2>'+ic("list")+t("admProducts")+' <span class="chip new">'+DATA.products.length+'</span></h2>' +
    '<div class="a-filters">' +
      '<div class="search-box"><svg class="icon" viewBox="0 0 24 24">'+ICONS.search+'</svg><input id="admSearch" type="search" placeholder="'+t("searchProd")+'" value="'+esc(admQ)+'"></div>' +
      '<select class="sort-sel" id="admCat"><option value="0">'+t("allCats")+'</option>'+DATA.categories.map(c=>'<option value="'+c.id+'"'+(admCat===c.id?" selected":"")+'>'+esc(L(c))+'</option>').join("")+'</select>' +
    '</div>' +
    '<div id="admProdTable"></div>' +
  '</div>';
}
function adminProductsApply(){
  const host = $("#admProdTable"); if(!host) return;
  let list = DATA.products.map(P);
  if(admCat){ list = list.filter(p=>p.cid===admCat); }
  if(admQ){ const q=admQ.toLowerCase(); list = list.filter(p=>(p.ar||"").toLowerCase().includes(q)||(p.en||"").toLowerCase().includes(q)); }
  list = list.slice().sort((a,b)=>a.o-b.o).slice(0,100);
  host.innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th>'+t("colProd")+'</th><th>'+t("colCat")+'</th><th>'+t("colPrice")+'</th><th>'+t("colFeat")+'</th><th>'+t("colAvail")+'</th><th>'+t("colActions")+'</th></tr></thead><tbody>' +
    list.map(p=>{
      const c = cat(p.cid);
      return '<tr>' +
        '<td><div style="display:flex;gap:.6rem;align-items:center"><img src="'+esc(p.img||FALLBACK_IMG)+'" alt="" loading="lazy"><div><div class="t-title">'+esc(L(p))+'</div></div></div></td>' +
        '<td><span class="t-cat">'+esc(c?L(c):"—")+'</span></td>' +
        '<td>'+(money(p.price)?esc(money(p.price)):'<span class="chip confirm">'+t("priceReq")+'</span>')+'</td>' +
        '<td><button class="chip '+(p.feat?"on":"off")+'" onclick="toggleField('+p.id+',\'f\')">'+(p.feat?t("yes"):t("no"))+'</button></td>' +
        '<td><button class="chip '+(p.avail?"on":"off")+'" onclick="toggleField('+p.id+',\'ok\')">'+(p.avail?t("yes"):t("no"))+'</button></td>' +
        '<td><button class="mini-btn" onclick="editPrice('+p.id+')">'+ic("edit")+t("edit")+'</button></td>' +
      '</tr>';
    }).join("") + '</tbody></table></div>' +
    (list.length===100?'<p class="ac-sub" style="margin-top:.6rem">… (100+)</p>':"");
  const si = $("#admSearch"); if(si) si.oninput = ()=>{ admQ = si.value; adminProductsApply(); };
  const cs = $("#admCat"); if(cs) cs.onchange = ()=>{ admCat = Number(cs.value); adminProductsApply(); };
}
function toggleField(id, field){
  if(!prod(id)) return;
  const ov = OVERRIDES[id] || {};
  const current = P(prod(id));
  ov[field] = !(field==="f"?current.feat:current.avail);
  OVERRIDES[id] = ov; saveAll(); adminProductsApply();
}
function editPrice(id){
  if(!prod(id)) return;
  const p = P(prod(id));
  const cur = p.price==null?"":p.price;
  const v = prompt(t("priceEditT")+" — "+L(p)+"\n"+t("priceEditSub"), cur);
  if(v===null) return;
  const ov = OVERRIDES[id] || {};
  ov.p = v.trim()==="" ? "" : (isNaN(Number(v))?null:Number(v));
  if(ov.p===null){ toast(t("submitErr"), true); return; }
  OVERRIDES[id] = ov; saveAll(); adminProductsApply(); toast(t("saved"));
}
function adminOrders(){
  return '<div class="admin-card"><h2>'+ic("bag")+t("admOrders")+' <span class="chip new">'+ORDERS.length+'</span></h2>' +

}

      const next = o.status==="new"?["confirmed",t("stConfirmL")]:(o.status==="confirmed"?["done",t("stDoneL")]:null);
      return '<tr>' +
        '<td><b>'+o.id+'</b></td>' +
        '<td><div class="t-title">'+esc(o.name)+'</div><span class="t-cat" dir="ltr">'+esc(o.phone)+'</span>'+(o.notes&&!compact?'<div style="font-size:.66rem;color:var(--mut-3);max-width:180px;margin-top:.25rem">'+esc(o.notes)+'</div>':"")+'</td>' +
        (compact?"":'<td><div class="ord-items">'+items+'</div>'+(o.total?'<div style="font-size:.7rem;font-weight:800;margin-top:.4rem">'+money(o.total)+'</div>':"")+'</td>') +
        '<td>'+statusChip+'</td>' +
        '<td style="white-space:nowrap;font-size:.68rem;color:var(--mut)">'+date+'</td>' +
        '<td style="white-space:nowrap">' + (next?'<button class="mini-btn solid" onclick="setOrderStatus(\''+o.id+'\',\''+next[0]+'\')">'+ic("check")+next[1]+'</button> ':'') + '<button class="mini-btn danger" onclick="delOrder(\''+o.id+'\')">'+ic("trash")+'</button></td>' +
      '</tr>';
    }).join("") + '</tbody></table></div>';
}
function setOrderStatus(id, st){
  const o = ORDERS.find(x=>x.id===id); if(o){ o.status = st; saveAll(); render(); toast(t("saved")); }
}
function delOrder(id){
  if(!confirm(t("confirmDel"))) return;

}
function adminSettings(){
  return '<div class="admin-card"><h2>'+ic("settings")+t("admSettings")+'</h2><p class="ac-sub">'+(isAr()?"تُحفظ التعديلات محلياً في هذا المتصفح وتنعكس فوراً على المتجر.":"Saved locally in this browser and applied instantly to the store.")+'</p>' +
    '<div class="settings-grid">' +
      '<div class="set-field"><label>'+t("setPhone")+'</label><input id="setPhone" value="'+esc(SETTINGS.phone)+'"></div>' +
      '<div class="set-field"><label>'+t("setWa")+'</label><input id="setWa" value="'+esc(SETTINGS.whatsapp)+'" dir="ltr"></div>' +
      '<div class="set-field"><label>'+t("setAddrAr")+'</label><input id="setAddrAr" value="'+esc(SETTINGS.addressAr)+'"></div>' +
      '<div class="set-field"><label>'+t("setAddrEn")+'</label><input id="setAddrEn" value="'+esc(SETTINGS.addressEn)+'"></div>' +
      '<div class="set-field"><label>'+t("setIg")+'</label><input id="setIg" value="'+esc(SETTINGS.instagram)+'" dir="ltr"></div>' +
      '<div class="set-field"><label>'+t("setPass")+'</label><input id="setPass" value="'+esc(SETTINGS.pass)+'"></div>' +
    '</div>' +
    '<div style="display:flex;gap:.75rem;margin-top:1.25rem;flex-wrap:wrap">' +
      '<button class="btn btn-teal" onclick="saveSettings()">'+ic("check")+t("save")+'</button>' +
      '<button class="btn btn-ghost" onclick="resetOverrides()">'+t("resetOv")+'</button>' +
    '</div>' +
  '</div>';
}
function saveSettings(){
  SETTINGS = {
    phone: $("#setPhone").value.trim()||SETTINGS.phone,
    whatsapp: ($("#setWa").value.trim()||SETTINGS.whatsapp).replace(/[^0-9]/g,""),
    addressAr: $("#setAddrAr").value.trim()||SETTINGS.addressAr,
    addressEn: $("#setAddrEn").value.trim()||SETTINGS.addressEn,
    instagram: ($("#setIg").value.trim()||SETTINGS.instagram).replace(/^@/,""),
    pass: $("#setPass").value.trim()||SETTINGS.pass,
  };
  saveAll(); applyChrome(); toast(t("saved"));
}
function resetOverrides(){ OVERRIDES = {}; saveAll(); toast(t("resetOvDone")); render(); }

/* ================= SEARCH ================= */
function wireSearch(inputSel, dropSel){
  const input = $(inputSel), drop = $(dropSel);
  if(!input) return;
  let timer = null;
  input.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>{
      const q = input.value.trim().toLowerCase();
      if(!q){ drop.style.display="none"; return; }
      const res = allProducts().filter(p=>(p.ar||"").toLowerCase().includes(q)||(p.en||"").toLowerCase().includes(q)).slice(0,8);
      drop.innerHTML = res.length
        ? res.map(p=>{ const c=cat(p.cid); return '<a class="sd-item" href="#/product/'+p.slug+'"><img src="'+esc(p.img||FALLBACK_IMG)+'" alt="" loading="lazy"><div><div class="sd-t">'+esc(L(p))+'</div><div class="sd-c">'+esc(c?L(c):"")+' · '+(money(p.price)?money(p.price):t("onRequest"))+'</div></div></a>'; }).join("")
        : '<div class="sd-empty">'+t("noResults")+'</div>';
      drop.style.display = "block";
    }, 180);
  });
  input.addEventListener("keydown", e=>{ if(e.key==="Enter"){ e.preventDefault(); drop.style.display="none"; nav("#/shop?q="+encodeURIComponent(input.value.trim())); } });
  document.addEventListener("click", e=>{ if(!drop.contains(e.target) && e.target!==input) drop.style.display="none"; });
  drop.addEventListener("click", ()=>{ drop.style.display="none"; input.value=""; $("#mmenu").classList.remove("show"); });
}

/* ================= SCROLL REVEAL ================= */
function wireReveal(){
  const els = document.querySelectorAll(".rv:not(.in)");
  if(!els.length) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ els.forEach(el=>el.classList.add("in")); return; }
  const io = new IntersectionObserver(entries=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin:"0px 0px -6% 0px", threshold:.06 });
  els.forEach(el=>io.observe(el));
}

/* ================= ROUTER ================= */
function parseHash(){
  const h = location.hash.replace(/^#\/?/, "");
  const [path, qs] = h.split("?");
  const params = {};
  if(qs) qs.split("&").forEach(kv=>{ const [k,v] = kv.split("="); params[k] = decodeURIComponent(v||"").replace(/\+/g," "); });
  const seg = path.split("/").filter(Boolean);
  return { seg, params };
}
function nav(hash){ location.hash = hash; }
function render(){
  const { seg, params } = parseHash();
  const v = $("#view");
  document.querySelectorAll("#navIn a").forEach(a=>a.classList.remove("active"));
  if(seg[0]==="shop" && params.cat){ const el = document.querySelector('#navIn a[href="#/shop?cat='+params.cat+'"]'); if(el) el.classList.add("active"); }
  else if(seg[0]==="shop" || !seg.length){ const el = document.querySelector('#navIn a[href="#/shop"]'); if(el) el.classList.add("active"); }

  if(!seg.length) v.innerHTML = homeView();
  else if(seg[0]==="shop") v.innerHTML = shopView(params);
  else if(seg[0]==="product" && seg[1]) v.innerHTML = productView(seg[1]);
  else if(seg[0]==="contact") v.innerHTML = contactView();
  else if(seg[0]==="admin") v.innerHTML = adminView();
  else v.innerHTML = notFoundView();

  clearInterval(heroTimer);
  if(!seg.length){ heroGo(0); heroStart(); }
  if(seg[0]==="shop") shopApply();
  if(seg[0]==="admin"){ if(adminTab==="products") adminProductsApply(); }
  wireSearch("#searchInput", "#searchDrop");
  wireSearch("#searchInputM", "#searchDropM");
  wireSearch("#searchInputMM", "#searchDropMM");
  wireReveal();
  document.documentElement.lang = LANG;
  document.documentElement.dir = isAr() ? "rtl" : "ltr";
  $("#langTxt").textContent = isAr() ? "English" : "العربية";
  window.scrollTo({ top: 0 });
}
window.addEventListener("hashchange", render);

  $("#topPolicy").textContent = t("policy");
  $("#accountTxt").textContent = t("account");

  $("#cartTxt").textContent = t("cart");

  $("#fAbout").textContent = t("fAbout");
  $("#fIg").href = "https://instagram.com/"+SETTINGS.instagram.replace(/^@/,"");
  $("#fIgTxt").textContent = "@"+SETTINGS.instagram.replace(/^@/,"");
  $("#fExploreT").textContent = t("fExplore");
  $("#fHelpT").textContent = t("fHelp");
  $("#fContactT").textContent = t("fContact");
  $("#fExplore").innerHTML =
    '<a href="#/">'+t("fHome")+'</a><a href="#/shop">'+t("allProducts")+'</a>' +
    cats.slice(0,3).map(c=>'<a href="#/shop?cat='+c.slug+'">'+esc(L(c))+'</a>').join("");

    '<a href="#/contact">'+t("fPolicy")+'</a>' +

    '<a href="https://wa.me/'+SETTINGS.whatsapp+'" target="_blank" rel="noreferrer">'+ic("phone")+'<span dir="ltr">'+SETTINGS.phone+'</span></a>' +
    '<div class="f-addr">'+ic("mapPin")+'<span>'+(isAr()?SETTINGS.addressAr:SETTINGS.addressEn)+'<br>'+t("fDeliver")+'</span></div>';

  $("#mmTitle").textContent = t("browseStore");

/* ================= FAVORITES POPOVER ================= */
function showFavs(){
  if(!FAVS.length){ toast(isAr()?"المفضلة فارغة — اضغط ♥ على أي منتج":"Favorites empty — tap heart on any product"); return; }
  const items = FAVS.map(id=>prod(id)).filter(Boolean).map(P);
  const drop = document.createElement("div");
  drop.className = "search-drop";
  drop.style.cssText = "position:fixed;top:70px;inset-inline-end:1rem;width:min(22rem,90vw);z-index:80;display:block";
  drop.innerHTML = items.map(p=>'<a class="sd-item" href="#/product/'+p.slug+'"><img src="'+esc(p.img||FALLBACK_IMG)+'" alt=""><div><div class="sd-t">'+esc(L(p))+'</div><div class="sd-c">'+(money(p.price)?money(p.price):t("onRequest"))+'</div></div></a>').join("") +
    '<div class="sd-empty" style="cursor:pointer" onclick="FAVS=[];saveAll();renderFavBadge();this.closest(\'.search-drop\').remove()">'+t("clearCart")+'</div>';
  document.body.appendChild(drop);
  setTimeout(()=>document.addEventListener("click", function h(e){ if(!drop.contains(e.target)){ drop.remove(); document.removeEventListener("click", h); } }), 10);
}

/* ================= INIT ================= */
function init(){
  const hs = DATA.heroSlides && DATA.heroSlides[0];
  if(hs && hs.img){ const pre = new Image(); pre.decoding = "async"; pre.src = hs.img; }
  $("#langBtn").addEventListener("click", ()=>{ LANG = isAr()?"en":"ar"; saveAll(); applyChrome(); render(); });
  $("#cartOpenBtn").addEventListener("click", openCart);
  $("#drawerClose").addEventListener("click", closeCart);
  $("#overlay").addEventListener("click", closeCart);
  $("#favBtn").addEventListener("click", showFavs);
  $("#menuBtn").addEventListener("click", ()=>$("#mmenu").classList.add("show"));
  $("#mmClose").addEventListener("click", ()=>$("#mmenu").classList.remove("show"));
  $("#mmCart").addEventListener("click", ()=>{ $("#mmenu").classList.remove("show"); openCart(); });
  $("#fabTop").addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
  window.addEventListener("scroll", ()=>{ $("#fabTop").classList.toggle("show", window.scrollY>500); }, {passive:true});
  applyChrome();
  render();
}
document.addEventListener("DOMContentLoaded", init);
</script>
